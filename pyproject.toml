[project]
name = "mavenaiproject"
version = "0.1.0"
description = "Maven AI learning materials and bootcamp workspace"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.57.0",
    "groq>=1.7.0",
    "ipykernel>=7.1.0",
    "make>=0.1.6.post2",
    "matplotlib>=3.11.2",
    "openai>=2.15.0",
    "pandas>=2.2.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "ragas>=0.3.1",
    "scipy>=1.18.1",
    "streamlit>=1.52.2",
    "xai-sdk>=1.20.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/chatbot_ui"]

[dependency-groups]
dev = [
    "langsmith>=0.14.9",
    "qdrant-client>=1.19.1",
    "ragas>=0.4.3",
    "langchain-community>=0.4.0,<0.4.2",
]
