[project]
name = "mavenaiproject"
version = "0.1.0"
description = "Maven AI learning materials and bootcamp workspace"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.32.0",
    "groq>=1.7.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "openai>=3.35.1",
    "pandas>=2.2.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "streamlit>=1.66.0",
    "xai-sdk>=1.20.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/chatbot_ui"]

[dependency-groups]
dev = [
    "qdrant-client>=1.20.0",
]
